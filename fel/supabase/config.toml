# NEXA FEL — configuración de Supabase (proyecto INDEPENDIENTE de NEXA).
# Se usa para Supabase LOCAL (pruebas en GitHub Actions) y como referencia para el proyecto real cuando se autorice.
project_id = "nexa-fel"

[api]
enabled = true
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:3000/fel/"
additional_redirect_urls = ["http://127.0.0.1:3000/fel/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Sin registro abierto: las personas solo entran por invitación (auth.admin.inviteUserByEmail).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

# MFA nativo (TOTP). La API exige aal2 para las operaciones administrativas.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.fel-api]
verify_jwt = true
