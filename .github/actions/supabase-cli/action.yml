name: Supabase CLI (instalación resistente)
description: >
  Instala la CLI de Supabase. La acción oficial resuelve «latest» con la API de GitHub sin autenticar y a veces falla con «rate limit exceeded» (ocurrió en los runs 85 y 86);
  si falla, se descarga el binario directamente del enlace de la última versión (que no usa la API) con reintentos. Una versión fija se puede pedir con la entrada «version».
inputs:
  version:
    description: "Versión de la CLI (p. ej. 2.40.7) o «latest»"
    default: latest
  sha256:
    description: "Huella SHA-256 esperada del paquete linux_amd64 (opcional; fija el binario exacto). Sin ella se verifica contra el archivo de sumas que publica el propio lanzamiento."
    default: ""
runs:
  using: composite
  steps:
    - id: oficial
      uses: supabase/setup-cli@v1
      continue-on-error: true
      with:
        version: ${{ inputs.version }}
    - name: Plan B · descarga directa (sin API de GitHub), con reintentos y verificación de integridad
      if: steps.oficial.outcome != 'success'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: bash "${{ github.action_path }}/instalar.sh"
    - name: Versión instalada (queda en el registro para reproducir)
      shell: bash
      run: supabase --version
