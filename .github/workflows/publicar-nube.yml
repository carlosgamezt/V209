name: NEXA FEL · publicación privada (manual)
# SOLO se ejecuta cuando TÚ la lanzas a mano (Actions → esta página → «Run workflow»); ningún push, pull request, programación ni mensaje de commit la activa.
# Aun lanzada, el trabajo queda en espera hasta que TÚ lo apruebes en el entorno protegido «demo-privada» (Required reviewers + ramas permitidas), y solo entonces recibe los secretos.
#  · modo «verificar» (por defecto): comprueba qué secretos y herramientas hay y muestra el plan. No toca nada.
#  · modo «publicar»: migraciones → base → función de Supabase → Cloudflare Pages con Wrangler → prueba de humo. Exige además escribir PUBLICAR.
# Los secretos tienen prefijo DEMO_ a propósito: así NUNCA se mezclan con los del proyecto principal de NEXA que ya existen en este repositorio (deploy-nexa / deploy-supabase).
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar (no toca nada) o publicar"
        type: choice
        options: [verificar, publicar]
        default: verificar
      confirmar:
        description: "Para «publicar», escribe PUBLICAR"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: publicar-nube
  cancel-in-progress: false
jobs:
  publicar:
    name: Publicación privada (Supabase + Cloudflare Pages)
    if: github.ref == 'refs/heads/fel-proveedores-diseno'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo-privada
    steps:
      - name: Confirmación explícita
        if: inputs.modo == 'publicar' && inputs.confirmar != 'PUBLICAR'
        run: echo "Para publicar hay que escribir PUBLICAR en «confirmar»."; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: ./.github/actions/supabase-cli
      # los secretos solo existen en ESTE paso (no en las acciones de terceros de arriba)
      - name: Ejecutar (${{ inputs.modo }})
        env:
          FEL_DEMO_PROYECTO_REF: ${{ secrets.DEMO_SUPABASE_PROYECTO_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEMO_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEMO_SUPABASE_DB_PASSWORD }}
          FEL_DEMO_BD_URL: ${{ secrets.DEMO_BD_URL }}
          SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY }}
          FEL_DEMO_CLAVES: ${{ secrets.DEMO_CLAVES }}
          FEL_DEMO_MFA_SEMILLAS: ${{ secrets.DEMO_MFA_SEMILLAS }}
          FEL_PROXY_SECRETO: ${{ secrets.DEMO_PROXY_SECRETO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEMO_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DEMO_CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROYECTO: ${{ secrets.DEMO_PAGES_PROYECTO }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ "$MODO" = publicar ]; then bash fel/tools/publicar-nube.sh; else bash fel/tools/publicar-nube.sh --simular; fi
