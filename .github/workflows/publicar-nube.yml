name: NEXA FEL · publicación privada (manual)
# SOLO se ejecuta cuando TÚ la lanzas a mano (Actions → esta página → «Run workflow»); ningún push, pull request, programación ni mensaje de commit la activa.
# Aun lanzada, el trabajo queda en espera hasta que TÚ lo apruebes en el entorno protegido «demo-privada» (Required reviewers + ramas permitidas), y solo entonces recibe los secretos.
#  · modo «verificar» (por defecto): comprueba qué secretos y herramientas hay y muestra el plan. No toca nada.
#  · modo «publicar»: migraciones → base → función de Supabase → Cloudflare Pages con Wrangler → prueba de humo. Exige además escribir PUBLICAR.
# Los secretos tienen prefijo DEMO_ a propósito: así NUNCA se mezclan con los del proyecto principal de NEXA que ya existen en este repositorio (deploy-nexa / deploy-supabase).
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar (no toca nada) · publicar · probar (SOLO la prueba de humo contra la página ya publicada; no migra ni despliega)"
        type: choice
        options: [verificar, publicar, probar]
        default: verificar
      confirmar:
        description: "Para «publicar», escribe PUBLICAR"
        type: string
        default: ""
      digifact:
        description: "Digifact TEST en la función: apagado (por defecto) o habilitado (solo si TÚ lo eliges en esta ejecución; los secretos de Digifact no se cargan si está apagado)"
        type: choice
        options: [apagado, habilitado]
        default: apagado
      digifact_nit:
        description: "Consulta de NIT por Digifact TEST (INDEPENDIENTE de la certificación): apagado (por defecto) o habilitado (solo si TÚ lo eliges en esta ejecución). Solo consulta; no habilita certificar, anular ni emitir. Requiere la empresa autorizada en digifact_nit_empresa"
        type: choice
        options: [apagado, habilitado]
        default: apagado
      digifact_nit_empresa:
        description: "Solo con digifact_nit=habilitado: UUID de LA ÚNICA empresa de demostración que consulta NIT reales (las demás usan el simulador)"
        type: string
        default: ""
      digifact_cui:
        description: "Consulta de CUI/DPI por Digifact TEST (INDEPENDIENTE de la certificación y de la consulta de NIT): apagado (por defecto) o habilitado (solo si TÚ lo eliges en esta ejecución). Solo consulta; no habilita certificar, anular ni emitir. Requiere la empresa autorizada en digifact_cui_empresa"
        type: choice
        options: [apagado, habilitado]
        default: apagado
      digifact_cui_empresa:
        description: "Solo con digifact_cui=habilitado: UUID de LA ÚNICA empresa de demostración que consulta CUI reales (las demás usan el simulador)"
        type: string
        default: ""
      digifact_correo:
        description: "Envío de la factura por correo por Digifact al certificar (INDEPENDIENTE de la certificación, del NIT y del CUI): apagado (por defecto) o habilitado (solo si TÚ lo eliges en esta ejecución). No habilita certificar. Requiere la empresa en digifact_correo_empresa y la lista cerrada de destinatarios de prueba (secreto DEMO_DIGIFACT_CORREO_DESTINATARIOS)"
        type: choice
        options: [apagado, habilitado]
        default: apagado
      digifact_correo_empresa:
        description: "Solo con digifact_correo=habilitado: UUID de LA ÚNICA empresa de demostración que puede pedir el envío por correo"
        type: string
        default: ""
      digifact_prueba:
        description: "Tras publicar (o en el modo «probar»): crea y certifica documentos de PRUEBA en Digifact TEST con la API real y valida XML, impuestos, UUID, serie y número. Solo con digifact=habilitado y digifact_referencia=CICLO-TEST. Apagado por defecto"
        type: choice
        options: [apagado, habilitado]
        default: apagado
      digifact_referencia:
        description: "Solo con digifact=habilitado: referencia (GUID) de LA ÚNICA prueba autorizada, o CICLO-TEST para autorizar el ciclo de pruebas en TEST (cualquier documento de la empresa de demostración mientras esta publicación esté vigente). Vacío = no autoriza ninguna"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: publicar-nube
  cancel-in-progress: false
jobs:
  publicar:
    name: Publicación privada (Supabase + Cloudflare Pages)
    if: github.ref == 'refs/heads/fel-proveedores-diseno'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo-privada
    steps:
      - name: Confirmación explícita
        if: inputs.modo == 'publicar' && inputs.confirmar != 'PUBLICAR'
        run: echo "Para publicar hay que escribir PUBLICAR en «confirmar»."; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: ./.github/actions/supabase-cli
      # los secretos solo existen en ESTE paso (no en las acciones de terceros de arriba)
      - name: Ejecutar (${{ inputs.modo }})
        env:
          FEL_DEMO_PROYECTO_REF: ${{ secrets.DEMO_SUPABASE_PROYECTO_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEMO_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEMO_SUPABASE_DB_PASSWORD }}
          FEL_DEMO_BD_URL: ${{ secrets.DEMO_BD_URL }}
          SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY }}
          FEL_DEMO_CLAVES: ${{ secrets.DEMO_CLAVES }}
          FEL_DEMO_MFA_SEMILLAS: ${{ secrets.DEMO_MFA_SEMILLAS }}
          FEL_PROXY_SECRETO: ${{ secrets.DEMO_PROXY_SECRETO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEMO_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DEMO_CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROYECTO: ${{ secrets.DEMO_PAGES_PROYECTO }}
          # Digifact TEST: SOLO con digifact=habilitado se cargan estos secretos; el script los aparta y únicamente los recibe el paso de la función (nunca Cloudflare ni el navegador).
          FEL_DIGIFACT_TEST: ${{ inputs.digifact == 'habilitado' && 'habilitado' || '' }}
          DIGIFACT_TEST_USERNAME: ${{ (inputs.digifact == 'habilitado' || inputs.digifact_nit == 'habilitado' || inputs.digifact_cui == 'habilitado') && secrets.DEMO_DIGIFACT_TEST_USERNAME || '' }}
          DIGIFACT_TEST_PASSWORD: ${{ (inputs.digifact == 'habilitado' || inputs.digifact_nit == 'habilitado' || inputs.digifact_cui == 'habilitado') && secrets.DEMO_DIGIFACT_TEST_PASSWORD || '' }}
          DIGIFACT_TEST_NIT: ${{ (inputs.digifact == 'habilitado' || inputs.digifact_nit == 'habilitado' || inputs.digifact_cui == 'habilitado') && secrets.DEMO_DIGIFACT_TEST_NIT || '' }}
          FEL_DIGIFACT_TEST_EMPRESA: ${{ inputs.digifact == 'habilitado' && secrets.DEMO_DIGIFACT_TEST_EMPRESA || '' }}
          FEL_DIGIFACT_TEST_EMISOR: ${{ inputs.digifact == 'habilitado' && secrets.DEMO_DIGIFACT_TEST_EMISOR || '' }}
          FEL_DIGIFACT_TEST_HUELLA: ${{ inputs.digifact == 'habilitado' && secrets.DEMO_DIGIFACT_TEST_HUELLA || '' }}
          FEL_DIGIFACT_AUTORIZA_REFERENCIA: ${{ inputs.digifact == 'habilitado' && inputs.digifact_referencia || '' }}
          FEL_DEMO_PRUEBA_DIGIFACT: ${{ inputs.digifact_prueba == 'habilitado' && 'habilitado' || '' }}
          # Consulta de NIT (independiente): solo usuario, contraseña y NIT de TEST; NUNCA el emisor, su huella ni la autorización de una referencia. Si la certificación ya los carga, son los mismos secretos.
          FEL_DIGIFACT_NIT: ${{ inputs.digifact_nit == 'habilitado' && 'habilitado' || '' }}
          FEL_DIGIFACT_NIT_EMPRESA: ${{ inputs.digifact_nit == 'habilitado' && inputs.digifact_nit_empresa || '' }}
          # Consulta de CUI (independiente de la certificación y del NIT): mismas credenciales de TEST; nada del emisor.
          FEL_DIGIFACT_CUI: ${{ inputs.digifact_cui == 'habilitado' && 'habilitado' || '' }}
          FEL_DIGIFACT_CUI_EMPRESA: ${{ inputs.digifact_cui == 'habilitado' && inputs.digifact_cui_empresa || '' }}
          # Correo de la factura por Digifact (independiente): solo el interruptor, la empresa y la lista CERRADA de destinatarios (secreto del entorno protegido); nunca credenciales, emisor ni referencia.
          FEL_DIGIFACT_CORREO: ${{ inputs.digifact_correo == 'habilitado' && 'habilitado' || '' }}
          FEL_DIGIFACT_CORREO_EMPRESA: ${{ inputs.digifact_correo == 'habilitado' && inputs.digifact_correo_empresa || '' }}
          FEL_DIGIFACT_CORREO_DESTINATARIOS: ${{ inputs.digifact_correo == 'habilitado' && secrets.DEMO_DIGIFACT_CORREO_DESTINATARIOS || '' }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ "$MODO" = publicar ]; then bash fel/tools/publicar-nube.sh; elif [ "$MODO" = probar ]; then bash fel/tools/publicar-nube.sh --probar; else bash fel/tools/publicar-nube.sh --simular; fi
