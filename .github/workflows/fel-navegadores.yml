name: NEXA FEL · navegadores (Firefox y WebKit)
# Recorrido E2E completo de la demostración SIMULADA (PC y teléfono emulado) en Firefox y WebKit; Chromium ya se prueba en «pruebas» y «paquete».
on:
  push:
    branches: [fel-proveedores-diseno]
    paths: ["fel/demo-facturacion/**", "fel/app/**", "fel/proveedores/src/**", ".github/workflows/fel-navegadores.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    name: E2E en ${{ matrix.navegador }}
    # Imagen FIJA: Playwright 1.49.1 solo trae dependencias de sistema para Ubuntu 20.04, 22.04 y 24.04 (y Debian 11/12). Con «ubuntu-latest» el ejecutor pasó a una versión más nueva
    # y «install --with-deps webkit» falló (paquetes libicu74, libvpx9, libx264-164 no disponibles). 24.04 es la que coincide con la lista de dependencias de esa versión de Playwright.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        navegador: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Playwright ${{ matrix.navegador }}
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.navegador }}
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: E2E completo
        env:
          FEL_E2E_NAVEGADOR: ${{ matrix.navegador }}
        run: node fel/demo-facturacion/tests/e2e_practico.cjs
      - name: Rediseño móvil de la factura (320/360/390/430 px) en ${{ matrix.navegador }}
        env:
          FEL_E2E_NAVEGADOR: ${{ matrix.navegador }}
        run: node fel/demo-facturacion/tests/e2e_movil.cjs
      - name: Autollenado del receptor en ${{ matrix.navegador }}
        env:
          FEL_E2E_NAVEGADOR: ${{ matrix.navegador }}
        run: node fel/demo-facturacion/tests/e2e_receptor.cjs
      - name: Anulación simulada (confirmación reforzada, marca ANULADO, permisos, 320/360/390/430 px) en ${{ matrix.navegador }}
        env:
          FEL_E2E_NAVEGADOR: ${{ matrix.navegador }}
        run: node fel/demo-facturacion/tests/e2e_anulacion.cjs
      - name: Rediseño móvil etapas 1 y 2 (marco y receptor inteligente) en ${{ matrix.navegador }}
        env:
          FEL_E2E_NAVEGADOR: ${{ matrix.navegador }}
        run: node fel/demo-facturacion/tests/e2e_rediseno.cjs
