name: NEXA FEL · Digifact TEST (manual)
# SOLO se ejecuta cuando TÚ la lanzas a mano (Actions → esta página → «Run workflow»); ningún push, pull request ni programación la activa.
# Aun lanzada, el trabajo queda en espera hasta que TÚ lo apruebes en el entorno protegido «demo-privada», y solo entonces recibe los secretos.
# Habla ÚNICAMENTE con el ambiente de pruebas de Digifact (https://testnucgt.digifact.com): el cliente bloquea producción. Nunca imprime la contraseña ni el token.
#  · autenticar          Prueba 1: obtiene un JWT de TEST (no se imprime).
#  · credenciales-presentes  SOLO presencia (sí/no) de usuario, contraseña y NIT de TEST: sin red, sin valores. Úsalo antes de la primera consulta.
#  · consultar-nit-privado   Prueba 2: UNA consulta real (SHARED_GETINFONITcom) del NIT de la PROPIA cuenta TEST, sin reintentos. Exige CONSULTAR-NIT-TEST en «confirmar». La salida solo dice encontrado / no encontrado,
#                        si el NIT devuelto coincide y si hubo nombre: NUNCA imprime el NIT, el nombre, las credenciales ni el texto del proveedor. (El paso anterior «consultar-nit» se retiró porque los imprimía.)
#  · consultar-cui-privado   UNA consulta real (SHARED_GETINFOCUI) del CUI de prueba guardado en el secreto DEMO_DIGIFACT_CUI_PRUEBA (nunca se escribe en la ejecución), sin reintentos. Exige CONSULTAR-CUI-TEST en «confirmar».
#                        La salida solo dice encontrado / no encontrado, si coincide y si hubo nombre: NUNCA imprime el CUI, el nombre, las credenciales ni el texto del proveedor.
#  · validar-nuc         Prueba 3: construye y valida la factura de prueba (sin red).
#  · listar-establecimientos  SOLO LECTURA: establecimientos que aparecen en el reporte de acuses de la cuenta (código, nombre, cantidad y una autorización de ejemplo por establecimiento). No inventa códigos.
#  · datos-emisor        SOLO LECTURA: lee de un DTE ya aceptado por SAT los datos del emisor y muestra la factura exacta que se enviaría (requiere «referencia»).
#  · certificar-test     Prueba 4: UNA certificación en TEST. Exige CERTIFICAR-TEST en «confirmar», la «referencia» mostrada y la «huella_emisor» aprobada.
#                        CORREO DE LA FACTURA ENVIADO POR DIGIFACT (opcional, apagado por defecto): con_correo = si + confirmar_correo = ENVIAR-CORREO-TEST. El destinatario NUNCA se escribe aquí: viene del secreto
#                        DEMO_DIGIFACT_CORREO_PRUEBA y debe estar en la lista cerrada DEMO_DIGIFACT_CORREO_DESTINATARIOS. Se verifica que Buyer.Contact.EmailList.Email lleve EXACTAMENTE ese correo y nada más cambie, y se
#                        bloquea si la referencia ya está certificada. La salida solo lleva el correo enmascarado; «solicitado» no es «entregado» (Digifact no confirma la entrega: se revisa el buzón).
#  · consulta-posterior  Prueba 5: consulta el DTE certificado por su autorización (UUID).
#  · descargar           Descarga XML/PDF de un DTE de TEST por su autorización.
# Secretos de ENTORNO (prefijo DEMO_, solo en este entorno): DEMO_DIGIFACT_TEST_USERNAME, DEMO_DIGIFACT_TEST_PASSWORD, DEMO_DIGIFACT_TEST_NIT; y, solo para consultar-cui-privado, DEMO_DIGIFACT_CUI_PRUEBA (el CUI de prueba autorizado).
# El «push» de abajo existe SOLO para que GitHub REGISTRE este flujo (un flujo que nunca ha tenido una ejecución no se puede lanzar por API desde una rama).
# Está limitado a este mismo archivo y el trabajo se OMITE siempre que el evento no sea un lanzamiento manual: ese camino nunca pide aprobación ni recibe secretos.
on:
  push:
    paths: ['.github/workflows/digifact-test.yml']
  workflow_dispatch:
    inputs:
      paso:
        description: "Prueba a ejecutar"
        type: choice
        options: [autenticar, credenciales-presentes, consultar-nit-privado, consultar-cui-privado, validar-nuc, listar-establecimientos, datos-emisor, certificar-test, consulta-posterior, descargar]
        default: autenticar
      confirmar:
        description: "Para «certificar-test», escribe CERTIFICAR-TEST; para «consultar-nit-privado», escribe CONSULTAR-NIT-TEST; para «consultar-cui-privado», escribe CONSULTAR-CUI-TEST"
        type: string
        default: ""
      nit_consulta:
        description: "NO USAR en «consultar-nit-privado» ni «consultar-cui-privado»: esas pruebas solo consulta el NIT de la cuenta TEST y rechaza cualquier valor aquí (déjalo vacío)"
        type: string
        default: ""
      autorizacion:
        description: "UUID del DTE para «consulta-posterior» y «descargar»"
        type: string
        default: ""
      referencia:
        description: "Referencia interna (GUID) de la factura de prueba, para «datos-emisor» y «certificar-test»"
        type: string
        default: ""
      huella_emisor:
        description: "Huella de los datos del emisor que aprobaste (la muestra «datos-emisor»), para «certificar-test»"
        type: string
        default: ""
      con_correo:
        description: "Pedir a Digifact que envíe el correo de la factura al certificar («datos-emisor» lo muestra sin enviar; «certificar-test» lo pide). Apagado por defecto"
        type: choice
        options: ["no", "si"]
        default: "no"
      confirmar_correo:
        description: "Solo con con_correo = si: escribe ENVIAR-CORREO-TEST. NO escribas aquí ningún correo (el destinatario viene de un secreto)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: digifact-test
  cancel-in-progress: false
jobs:
  digifact:
    name: Digifact TEST
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fel-proveedores-diseno'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: demo-privada
    steps:
      - name: Confirmación explícita
        if: inputs.paso == 'certificar-test' && inputs.confirmar != 'CERTIFICAR-TEST'
        run: echo "Para certificar en TEST hay que escribir CERTIFICAR-TEST en «confirmar»."; exit 1
      - name: Confirmación explícita (correo de la factura por Digifact)
        if: inputs.con_correo == 'si' && inputs.paso == 'certificar-test' && inputs.confirmar_correo != 'ENVIAR-CORREO-TEST'
        run: echo "Para pedir el correo hay que escribir ENVIAR-CORREO-TEST en «confirmar_correo» (con_correo = si)."; exit 1
      - name: Confirmación explícita (consulta privada de NIT)
        if: inputs.paso == 'consultar-nit-privado' && inputs.confirmar != 'CONSULTAR-NIT-TEST'
        run: echo "Para la consulta privada de NIT hay que escribir CONSULTAR-NIT-TEST en «confirmar»."; exit 1
      - name: Confirmación explícita (consulta privada de CUI)
        if: inputs.paso == 'consultar-cui-privado' && inputs.confirmar != 'CONSULTAR-CUI-TEST'
        run: echo "Para la consulta privada de CUI hay que escribir CONSULTAR-CUI-TEST en «confirmar»."; exit 1
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # los secretos solo existen en ESTE paso (no en las acciones de terceros de arriba ni de abajo)
      - name: Ejecutar (${{ inputs.paso }})
        env:
          DIGIFACT_TEST_USERNAME: ${{ secrets.DEMO_DIGIFACT_TEST_USERNAME }}
          DIGIFACT_TEST_PASSWORD: ${{ secrets.DEMO_DIGIFACT_TEST_PASSWORD }}
          DIGIFACT_TEST_NIT: ${{ secrets.DEMO_DIGIFACT_TEST_NIT }}
          DIGIFACT_CUI_PRUEBA: ${{ (inputs.paso == 'consultar-cui-privado' || inputs.paso == 'credenciales-presentes') && secrets.DEMO_DIGIFACT_CUI_PRUEBA || '' }}
          PASO: ${{ inputs.paso }}
          DIGIFACT_CONFIRMAR: ${{ inputs.confirmar }}
          DIGIFACT_NIT_CONSULTA: ${{ inputs.nit_consulta }}
          DIGIFACT_AUTORIZACION: ${{ inputs.autorizacion }}
          DIGIFACT_REFERENCIA: ${{ inputs.referencia }}
          DIGIFACT_HUELLA_EMISOR: ${{ inputs.huella_emisor }}
          DIGIFACT_CON_CORREO: ${{ inputs.con_correo }}
          DIGIFACT_CONFIRMAR_CORREO: ${{ inputs.confirmar_correo }}
          # los secretos del correo solo se entregan cuando hacen falta: comprobar su presencia, vista previa (datos-emisor) o certificar con correo
          DIGIFACT_CORREO_PRUEBA: ${{ (inputs.paso == 'credenciales-presentes' || (inputs.con_correo == 'si' && (inputs.paso == 'datos-emisor' || inputs.paso == 'certificar-test'))) && secrets.DEMO_DIGIFACT_CORREO_PRUEBA || '' }}
          DIGIFACT_CORREO_DESTINATARIOS: ${{ (inputs.paso == 'credenciales-presentes' || (inputs.con_correo == 'si' && (inputs.paso == 'datos-emisor' || inputs.paso == 'certificar-test'))) && secrets.DEMO_DIGIFACT_CORREO_DESTINATARIOS || '' }}
        run: |
          case "$PASO" in autenticar|credenciales-presentes|consultar-nit-privado|consultar-cui-privado|validar-nuc|datos-emisor|certificar-test|consulta-posterior|descargar) ;; *) echo "Paso no válido"; exit 2;; esac
          cd fel/proveedores
          deno run --allow-net=testnucgt.digifact.com --allow-env=DIGIFACT_TEST_USERNAME,DIGIFACT_TEST_PASSWORD,DIGIFACT_TEST_NIT,DIGIFACT_CUI_PRUEBA,DIGIFACT_CONFIRMAR,DIGIFACT_NIT_CONSULTA,DIGIFACT_AUTORIZACION,DIGIFACT_ESQUEMA,DIGIFACT_SALIDA,DIGIFACT_REFERENCIA,DIGIFACT_HUELLA_EMISOR,DIGIFACT_CON_CORREO,DIGIFACT_CONFIRMAR_CORREO,DIGIFACT_CORREO_PRUEBA,DIGIFACT_CORREO_DESTINATARIOS --allow-read --allow-write=./salida digifact_prueba.ts "$PASO"
      # solo los documentos de TEST de una certificación; se borran al día siguiente
      - name: Documentos de la certificación de prueba
        if: inputs.paso == 'certificar-test' && always()
        uses: actions/upload-artifact@v4
        with:
          name: digifact-test-documentos
          path: fel/proveedores/salida
          retention-days: 1
          if-no-files-found: ignore
