name: Consultar Supabase (solo lectura)

on:
  workflow_dispatch:
    inputs:
      archivo:
        description: 'Archivo .sql dentro de supabase/consultas (solo SELECT)'
        required: true

jobs:
  consulta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ARCH: ${{ github.event.inputs.archivo }}
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar consulta de solo lectura
        run: |
          echo "$ARCH" | grep -Eq '^[a-z0-9_.-]+\.sql$' || { echo "Nombre de archivo no válido"; exit 1; }
          f="supabase/consultas/$ARCH"
          test -f "$f" || { echo "No existe $f"; exit 1; }
          if grep -Eiq '\b(insert|update|delete|drop|alter|truncate|create|grant|revoke|copy|call|do)\b' "$f"; then echo "Solo se permiten consultas SELECT"; exit 1; fi
          jq -Rs '{query: .}' "$f" > /tmp/q.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          echo "HTTP $code"; echo "RESULTADO:"; cat /tmp/out.json; echo
          [ "$code" -lt 300 ]
