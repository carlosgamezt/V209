name: NEXA FEL · pruebas
# Solo pruebas, con Supabase LOCAL efímero. No se conecta a ningún proyecto real ni publica nada.
on:
  workflow_dispatch:
  push:
    branches: ['fel-**']
    paths: ['fel/**', '.github/workflows/fel-tests.yml']

permissions:
  contents: read

jobs:
  funcion:
    name: Función fel-api (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tipos y pruebas
        working-directory: fel/supabase/functions/fel-api
        run: |
          deno check index.ts nucleo.ts acciones.ts lib/*.ts seguridad_test.ts
          deno test lib/ nucleo_test.ts seguridad_test.ts

  interfaz:
    name: Interfaz (modo demostración)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Pruebas de interfaz y de autenticación
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node fel/app/tests/ui.cjs
          node fel/app/tests/auth.cjs
          node fel/app/tests/cuentas.cjs
      - name: Guardia del script de integración (rechaza proyectos no autorizados)
        run: node --test fel/tools/integracion-local/guardia.test.mjs

  base-de-datos:
    name: Migraciones y RLS (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar Supabase local y aplicar migraciones
        run: supabase --workdir fel start
      - name: Ejecutar pruebas SQL
        env:
          PGPASSWORD: postgres
        run: |
          for f in fel/supabase/tests/*.sql; do
            echo "== $f"
            psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -X -f "$f"
          done
      - name: Pruebas de concurrencia (dos sesiones reales)
        env:
          PGPASSWORD: postgres
          PSQL_CMD: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
        run: bash fel/supabase/tests/concurrencia.sh
      - name: Detener
        if: always()
        run: supabase --workdir fel stop --no-backup

  integracion-local:
    name: Integración con Supabase local real (Auth + PostgREST + fel-api)
    runs-on: ubuntu-latest
    # Supabase LOCAL y efímero: GoTrue, PostgREST y PostgreSQL reales con las migraciones; fel-api corre con Deno contra esa pila.
    # No usa ningún proyecto real ni credenciales reales.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar Supabase local y aplicar migraciones
        run: supabase --workdir fel start
      - name: Exportar claves LOCALES de la pila efímera
        run: |
          supabase --workdir fel status -o env 2>/dev/null | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/sb.env"
          echo "Variables disponibles: $(cut -d= -f1 "$RUNNER_TEMP/sb.env" | tr '\n' ' ')"
      - name: Arrancar fel-api (Deno) contra la pila local
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}" FEL_APP_URL="http://127.0.0.1:3000/fel/" \
            nohup deno run -A fel/supabase/functions/fel-api/index.ts > "$RUNNER_TEMP/fel-api.log" 2>&1 &
          for i in $(seq 1 40); do curl -s -o /dev/null http://127.0.0.1:8000 && break; sleep 1; done
          curl -s -o /dev/null -w "fel-api responde: %{http_code}\n" http://127.0.0.1:8000
      - name: Etapa 1 · verificar (solo lectura)
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          RESULTADOS="$RUNNER_TEMP/integracion-verificar.json" node fel/tools/integracion-local/ejecutar.mjs --etapa=verificar
      - name: Etapa 2 · ejecutar (crea datos y escribe el manifiesto)
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          RESULTADOS="$RUNNER_TEMP/integracion-ejecutar.json" node fel/tools/integracion-local/ejecutar.mjs --etapa=ejecutar --manifiesto="$RUNNER_TEMP/manifiesto.json"
      - name: Etapa 3 · limpiar (solo lo registrado en el manifiesto)
        if: always()
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          if [ -f "$RUNNER_TEMP/manifiesto.json" ]; then
            RESULTADOS="$RUNNER_TEMP/integracion-limpiar.json" node fel/tools/integracion-local/ejecutar.mjs --etapa=limpiar --manifiesto="$RUNNER_TEMP/manifiesto.json"
          else echo "No hay manifiesto: la ejecución no creó nada."; fi
      - name: Registro de fel-api
        if: always()
        run: |
          echo "---- fel-api.log (últimas líneas) ----"; tail -n 40 "$RUNNER_TEMP/fel-api.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracion-local-resultados
          path: |
            ${{ runner.temp }}/integracion-*.json
            ${{ runner.temp }}/manifiesto.json
          if-no-files-found: ignore
      - name: Detener
        if: always()
        run: supabase --workdir fel stop --no-backup
