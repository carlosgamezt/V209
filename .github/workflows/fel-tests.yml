name: NEXA FEL · pruebas
# Solo pruebas, con Supabase LOCAL efímero. No se conecta a ningún proyecto real ni publica nada.
on:
  workflow_dispatch:
  push:
    branches: ['fel-**']
    paths: ['fel/**', '.github/workflows/fel-tests.yml']

permissions:
  contents: read

jobs:
  funcion:
    name: Función fel-api (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tipos y pruebas
        working-directory: fel/supabase/functions/fel-api
        run: |
          deno check index.ts nucleo.ts acciones.ts lib/*.ts seguridad_test.ts
          deno test lib/ nucleo_test.ts seguridad_test.ts
      - name: Proveedores de emisión (interfaz + mock + orquestador de referencia, solo simulación)
        working-directory: fel/proveedores
        run: |
          deno check src/mod.ts src/repo_pg.ts pruebas/*.ts pruebas_db/*.ts
          deno test pruebas/
      - name: Demostración de facturación simulada (tipos)
        working-directory: fel/demo-facturacion
        run: deno check servidor.ts src/*.ts tests/*.ts

  interfaz:
    name: Interfaz (modo demostración)
    runs-on: ubuntu-latest
    timeout-minutes: 25          # una espera anómala falla rápido y a la vista, no en silencio
    # Imagen oficial de Playwright (misma versión que el paquete npm), fijada por etiqueta Y digest: trae Chromium 131 y sus dependencias,
    # así que ya no se instala nada con apt (los espejos de Ubuntu fallaron por DNS en 3 ejecuciones seguidas). Solo este trabajo usa contenedor.
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble@sha256:70e367e0cbf60340a5b5fd562f6247a34eb3196efab9f88a3dd56482d9fe09d2
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Deno 2.9.6 con npm (la imagen no trae unzip, que necesita setup-deno)
        run: |
          npm install -g deno@2.9.6
          test "$(deno --version | head -n 1 | cut -d' ' -f2)" = "2.9.6"
          deno --version
      - name: Preparar Playwright (paquete npm; los navegadores ya vienen en la imagen) y comprobar versión y arranque
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.49.1 angular@1.5.8 jquery@3.7.1
          test "$("$RUNNER_TEMP/pw/node_modules/.bin/playwright" --version)" = "Version 1.49.1"
          # Ruta de módulos para los pasos siguientes (en un contenedor, $RUNNER_TEMP es la ruta correcta dentro de él)
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node -e "require('playwright').chromium.launch().then(async b => { const v = b.version(); console.log('Chromium', v); await b.close(); if (!/^131[.]/.test(v)) { console.error('Se esperaba Chromium 131 y se obtuvo ' + v); process.exit(1); } })"
      - name: Pruebas de interfaz y de autenticación
        run: |
          node fel/app/tests/ui.cjs
          node fel/app/tests/auth.cjs
          node fel/app/tests/cuentas.cjs
      - name: Demostración de facturación individual SIMULADA (navegador + orquestador real + PostgreSQL en memoria; sin credenciales ni red externa)
        run: node fel/demo-facturacion/tests/e2e.cjs
      - name: Servidor de la demostración con el plano de control del agente (firma Ed25519 por HTTP, supervisor periódico y cierre ordenado; simulado y local)
        run: deno test -A fel/demo-facturacion/tests/agente_servidor_test.ts
      - name: Simulador FEL del agente local (núcleo, servidor 127.0.0.1 y formulario en Chromium; confirmación solo humana, interrupciones, duplicados; sin SAT ni credenciales)
        run: node --test "fel/agente-local/pruebas/nucleo.test.mjs" "fel/agente-local/pruebas/servidor.test.mjs" "fel/agente-local/pruebas/concesion.test.mjs" "fel/agente-local/pruebas/navegador.test.mjs"
      - name: Agente local con Playwright (Chromium 131 exigido) contra NEXA de prueba y el simulador; autorización humana separada, desconexiones, revocación, aislamiento, fencing y recuperación (todo local y simulado)
        timeout-minutes: 15
        run: node --test --test-concurrency=1 fel/agente-local/pruebas/agente.test.mjs
      - name: Guardia del script de integración (rechaza proyectos no autorizados)
        run: node --test fel/tools/integracion-local/guardia.test.mjs
      - name: PoC de viabilidad del portal FEL (guardia + autoprueba con Chrome contra página de ejemplo local; no toca ningún sistema real)
        run: |
          node --test fel/poc-sat/tests/guardia.test.mjs
          node fel/poc-sat/tests/autoprueba.mjs
          node fel/poc-sat/tests/simulacion-angular.mjs

  base-de-datos:
    name: Migraciones y RLS (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar Supabase local y aplicar migraciones
        run: supabase --workdir fel start
      - name: Ejecutar pruebas SQL
        env:
          PGPASSWORD: postgres
        run: |
          for f in fel/supabase/tests/*.sql; do
            echo "== $f"
            psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -X -f "$f"
          done
      - name: Pruebas de concurrencia (dos sesiones reales)
        env:
          PGPASSWORD: postgres
          PSQL_CMD: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
        run: bash fel/supabase/tests/concurrencia.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Orquestador, agente local y plano de control contra PostgreSQL real (flujo, órdenes, firma, nonce, aislamiento, supervisor y prueba de propiedades con caídas)
        working-directory: fel/proveedores
        env:
          FEL_PGHOST: 127.0.0.1
          FEL_PGPORT: "54322"
          FEL_PGUSER: postgres
          FEL_PGPASSWORD: postgres
          FEL_PGDATABASE: postgres
        run: deno test -A pruebas_db/
      - name: Detener
        if: always()
        run: supabase --workdir fel stop --no-backup

  integracion-local:
    name: Integración con Supabase local real (Auth + PostgREST + fel-api)
    runs-on: ubuntu-latest
    # Supabase LOCAL y efímero: GoTrue, PostgREST y PostgreSQL reales con las migraciones; fel-api corre con Deno contra esa pila.
    # No usa ningún proyecto real ni credenciales reales.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar Supabase local y aplicar migraciones
        run: supabase --workdir fel start
      - name: Exportar claves LOCALES de la pila efímera
        run: |
          supabase --workdir fel status -o env 2>/dev/null | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/sb.env"
          echo "Variables disponibles: $(cut -d= -f1 "$RUNNER_TEMP/sb.env" | tr '\n' ' ')"
      - name: Arrancar fel-api (Deno) contra la pila local
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}" FEL_APP_URL="http://127.0.0.1:3000/fel/" \
            nohup deno run -A fel/supabase/functions/fel-api/index.ts > "$RUNNER_TEMP/fel-api.log" 2>&1 &
          for i in $(seq 1 40); do curl -s -o /dev/null http://127.0.0.1:8000 && break; sleep 1; done
          curl -s -o /dev/null -w "fel-api responde: %{http_code}\n" http://127.0.0.1:8000
      - name: Etapa 1 · verificar (solo lectura)
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          RESULTADOS="$RUNNER_TEMP/integracion-verificar.json" node fel/tools/integracion-local/ejecutar.mjs --etapa=verificar
      - name: Etapa 2 · ejecutar (crea datos y escribe el manifiesto)
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          RESULTADOS="$RUNNER_TEMP/integracion-ejecutar.json" node fel/tools/integracion-local/ejecutar.mjs --etapa=ejecutar --manifiesto="$RUNNER_TEMP/manifiesto.json"
      - name: Etapa 3 · limpiar (solo lo registrado en el manifiesto)
        if: always()
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          if [ -f "$RUNNER_TEMP/manifiesto.json" ]; then
            RESULTADOS="$RUNNER_TEMP/integracion-limpiar.json" node fel/tools/integracion-local/ejecutar.mjs --etapa=limpiar --manifiesto="$RUNNER_TEMP/manifiesto.json"
          else echo "No hay manifiesto: la ejecución no creó nada."; fi
      - name: Registro de fel-api
        if: always()
        run: |
          echo "---- fel-api.log (últimas líneas) ----"; tail -n 40 "$RUNNER_TEMP/fel-api.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracion-local-resultados
          path: |
            ${{ runner.temp }}/integracion-*.json
            ${{ runner.temp }}/manifiesto.json
          if-no-files-found: ignore
      - name: Detener
        if: always()
        run: supabase --workdir fel stop --no-backup
