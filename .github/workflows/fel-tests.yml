name: NEXA FEL · pruebas
# Solo pruebas, con Supabase LOCAL efímero. No se conecta a ningún proyecto real ni publica nada.
on:
  workflow_dispatch:
  push:
    branches: ['fel-**']
    paths: ['fel/**', '.github/workflows/fel-tests.yml']

permissions:
  contents: read

jobs:
  funcion:
    name: Función fel-api (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Instalación de la CLI de Supabase · plan B con verificación de integridad (sin red externa)
        run: bash fel/tools/test-instalar-cli.sh
      - name: Proyecto de Cloudflare Pages · crear o reutilizar con Wrangler (API simulada, sin cuenta real)
        run: bash fel/tools/test-pages-proyecto.sh
      - name: Supabase hospedado · sintaxis de la CLI v3 y destino fijo (CLI falsa, sin credenciales)
        run: bash fel/tools/test-supabase-hospedado.sh
      - name: Garantías de la publicación privada (solo manual, entorno protegido, secretos DEMO_ aislados)
        run: pip install --quiet pyyaml && python3 fel/tools/verificar-publicacion.py
      - name: Script de publicación (simulación, solo comprueba variables y muestra el plan)
        run: bash fel/tools/publicar-nube.sh --simular | tail -9
      - name: Tipos y pruebas
        working-directory: fel/supabase/functions/fel-api
        run: |
          deno check index.ts nucleo.ts acciones.ts lib/*.ts seguridad_test.ts
          deno test lib/ nucleo_test.ts seguridad_test.ts
      - name: Proveedores de emisión (interfaz + mock + orquestador de referencia, solo simulación)
        working-directory: fel/proveedores
        run: |
          deno check src/mod.ts src/repo_pg.ts pruebas/*.ts pruebas_cli/*.ts pruebas_db/*.ts
          deno test --allow-net=127.0.0.1 pruebas/
      - name: Consulta privada de NIT por línea de órdenes (subproceso real; único paso con --allow-run, solo al binario de deno; debe EJECUTARSE y pasar, no omitirse)
        working-directory: fel/proveedores
        env:
          NO_COLOR: "1"
        run: |
          DENO_BIN="$(deno eval 'console.log(Deno.execPath())')"
          deno test --allow-run="$DENO_BIN" --allow-read pruebas_cli/ > salida_cli.txt 2>&1 || { cat salida_cli.txt; exit 1; }
          cat salida_cli.txt
          grep -q "ok | 3 passed | 0 failed" salida_cli.txt || { echo "Las pruebas de la línea de órdenes (NIT, CUI y correo de prueba) deben ejecutarse y pasar (3 passed, 0 failed)"; exit 1; }
          ! grep -qi "ignored" salida_cli.txt || { echo "La prueba de la línea de órdenes no puede quedar omitida"; exit 1; }
      - name: Demostración de facturación simulada (tipos)
        working-directory: fel/demo-facturacion
        run: deno check servidor.ts src/*.ts tests/*.ts nube/proxy.ts nube/funcion.ts nube/funcion_entrada.ts nube/aprovisionar.ts nube/construir.ts nube/pages/worker.ts nube/local.ts nube/prueba_humo.ts nube/bd_entorno.ts
      - name: Motor fiscal D1-A (recursos oficiales verificados por hash, aritmética decimal exacta, validación estructural y bloqueo de escenarios no aprobados; no calcula ni certifica)
        working-directory: fel/fiscal
        run: |
          deno check mod.ts pruebas/*.ts
          deno test -A pruebas/
      - name: "Tipos de documento (propuesta de migración, fuera de supabase/migrations): prueba SQL, verificación posterior, reversión segura y reaplicación en un PostgreSQL temporal (sin Supabase, sin red)"
        run: bash fel/tools/test-tipos-documento.sh
      # Respaldo de nexa-demo: va al FINAL del trabajo a propósito (un fallo aquí no puede dejar sin ejecutar los pasos de arriba). PostgreSQL 17 se instala con la acción verificada (huella de la clave, versión mayor fijada,
      # herramientas comprobadas) en lugar de suponer una ruta fija del ejecutor; la prueba detecta lo instalado y NO se omite si falta.
      - name: age (cifrado del respaldo persistente; la prueba lo exige y NO se omite si falta)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version && age-keygen --version
      - name: PostgreSQL 17 con servidor (instalación verificada) para la prueba del respaldo
        uses: ./.github/actions/postgresql-17
        with:
          servidor: "true"
      - name: Respaldo de nexa-demo (verificar-respaldo con curl falso; ensayo de respaldo y restauración efímera con PostgreSQL real y todas sus protecciones; sin red ni credenciales)
        run: bash fel/tools/test-respaldo-nexa-demo.sh

  interfaz:
    name: Interfaz (modo demostración)
    runs-on: ubuntu-latest
    timeout-minutes: 25          # una espera anómala falla rápido y a la vista, no en silencio
    # Imagen oficial de Playwright (misma versión que el paquete npm), fijada por etiqueta Y digest: trae Chromium 131 y sus dependencias,
    # así que ya no se instala nada con apt (los espejos de Ubuntu fallaron por DNS en 3 ejecuciones seguidas). Solo este trabajo usa contenedor.
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble@sha256:70e367e0cbf60340a5b5fd562f6247a34eb3196efab9f88a3dd56482d9fe09d2
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Deno 2.9.6 con npm (la imagen no trae unzip, que necesita setup-deno)
        run: |
          npm install -g deno@2.9.6
          test "$(deno --version | head -n 1 | cut -d' ' -f2)" = "2.9.6"
          deno --version
      - name: Preparar Playwright (paquete npm; los navegadores ya vienen en la imagen) y comprobar versión y arranque
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.49.1 angular@1.5.8 jquery@3.7.1
          test "$("$RUNNER_TEMP/pw/node_modules/.bin/playwright" --version)" = "Version 1.49.1"
          # Ruta de módulos para los pasos siguientes (en un contenedor, $RUNNER_TEMP es la ruta correcta dentro de él)
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node -e "require('playwright').chromium.launch().then(async b => { const v = b.version(); console.log('Chromium', v); await b.close(); if (!/^131[.]/.test(v)) { console.error('Se esperaba Chromium 131 y se obtuvo ' + v); process.exit(1); } })"
      - name: Pruebas de interfaz y de autenticación
        run: |
          node fel/app/tests/ui.cjs
          node fel/app/tests/auth.cjs
          node fel/app/tests/cuentas.cjs
      - name: Demostración de facturación individual SIMULADA (navegador + orquestador real + PostgreSQL en memoria; sin credenciales ni red externa)
        run: node fel/demo-facturacion/tests/e2e.cjs
      - name: Acceso anticipado de la demostración (rótulo DEMO, menú móvil «4 + Más», «Reportar un problema», precio Q0.00 con aviso y negativos rechazados)
        run: node fel/demo-facturacion/tests/e2e_acceso.cjs
      - name: Rediseño móvil de la factura (320/360/390/430 px · una pantalla, captura rápida de ítems, «Más acciones», sin solapamientos ni desplazamiento horizontal, vista previa, impresión y PDF en carta y ticket de 80 mm)
        run: node fel/demo-facturacion/tests/e2e_movil.cjs
      - name: Autollenado del receptor (NIT y CUI ficticios del simulador, consulta de CUI independiente, «Consultando NIT», cambios rápidos, sin coincidencia, error del proveedor, nombre manual conservado y CONSUMIDOR FINAL con su tope)
        run: |
          deno test -A fel/demo-facturacion/tests/receptor_nit_test.ts fel/demo-facturacion/tests/receptor_nit_api_test.ts fel/demo-facturacion/tests/digifact_nit_separacion_test.ts fel/demo-facturacion/tests/receptor_cui_api_test.ts
          node fel/demo-facturacion/tests/e2e_receptor.cjs
      - name: Anulación simulada (confirmación y motivo en el servidor, permisos, aislamiento, marca ANULADO en vista previa y PDF, rechazada y pendiente; teléfono 320–430 px)
        run: |
          deno test -A fel/demo-facturacion/tests/anulacion_test.ts
          node fel/demo-facturacion/tests/e2e_anulacion.cjs
      - name: Pantalla de documento emitido (total, serie, número, UUID y ambiente; PDF carta y ticket, imprimir, compartir, correo, permisos; 320/360/390/412/768/1440 px; simulado y local)
        run: node fel/demo-facturacion/tests/e2e_emitido.cjs
      - name: Receptor Consumidor Final (identificación CF fija y nombre editable sin pasar a NIT; se conserva al guardar, reabrir y revisar; PDF con el nombre; 390 y 1100 px; simulado y local)
        run: node fel/demo-facturacion/tests/e2e_cf.cjs
      - name: Identificación del receptor en el navegador (CF, NIT, CUI y pasaporte; teléfono y computadora)
        run: node fel/demo-facturacion/tests/e2e_identificacion.cjs
      - name: Revisión visual automática de las pantallas principales (Documentos, Nueva factura, Clientes, Conceptos, Configuración y Panel; 320/360/390/412/768/1440 px; sin desbordes y objetivos táctiles; simulado y local)
        run: node fel/demo-facturacion/tests/e2e_vistas.cjs
      - name: Paginación de clientes y conceptos en el servidor (más de 500 clientes y 200 conceptos; búsqueda, indicadores, CSV, factura con cliente fuera del conjunto de trabajo; nunca la lista completa)
        run: node fel/demo-facturacion/tests/e2e_paginacion.cjs
      - name: "Correo de facturas (proveedor SIMULADO, nada sale a la red) · servicio, Resend con fetch falso, plantilla, duplicados, permisos, aislamiento, envío automático apagado por defecto y navegador (teléfono 320–430 px)"
        run: |
          deno test -A fel/demo-facturacion/tests/correo_test.ts
          node fel/demo-facturacion/tests/e2e_correo.cjs
      - name: "Correo de la factura enviado por Digifact al certificar (apagado por defecto; lista cerrada de destinatarios; Buyer.Contact; solicitado, nunca entregado; sin duplicados; teléfono 320–430 px)"
        run: |
          deno test -A fel/demo-facturacion/tests/digifact_correo_test.ts
          node fel/demo-facturacion/tests/e2e_digifact_correo.cjs
          node fel/demo-facturacion/tests/e2e_digifact_panel.cjs
      - name: Rediseño móvil de Nueva factura, etapas 1 y 2 (encabezado y navegación, menú de la cuenta, receptor inteligente NIT/CUI/CF/Otro, «Marcar revisado» sin certificar, 320–430 px con importes grandes)
        run: node fel/demo-facturacion/tests/e2e_rediseno.cjs
      - name: "Tipos de documento (DTE): catálogo = base, notas con origen certificado, recibo, habilitación por empresa, certificación de tipos nuevos BLOQUEADA, selector compacto y configuración (teléfono y PC; simulado y local)"
        run: |
          deno test -A fel/demo-facturacion/tests/catalogo_migracion_test.ts fel/demo-facturacion/tests/tipos_documento_api_test.ts fel/demo-facturacion/tests/lista_paginada_api_test.ts fel/demo-facturacion/tests/cache_cliente_test.ts fel/demo-facturacion/tests/pdf_matriz_api_test.ts fel/demo-facturacion/tests/seguridad_api_test.ts fel/demo-facturacion/tests/ncre_test_api_test.ts
          node fel/demo-facturacion/tests/e2e_tipos.cjs
      - name: "Fecha de emisión (hasta 5 días calendario atrás, zona de Guatemala, validación en el servidor, auditoría, inmutabilidad; teléfono y PC; simulado y local)"
        run: |
          deno test -A fel/demo-facturacion/tests/fecha_emision_api_test.ts
          node fel/demo-facturacion/tests/e2e_fecha_emision.cjs
      - name: "Ciclo guardar y certificar en Digifact TEST (se guarda siempre, confirmación en un diálogo, nada sin confirmar, rechazo, resultado incierto y caída conservan el documento; vista previa con BR e IVA; teléfono y PC; Digifact simulado en el navegador)"
        run: |
          node fel/demo-facturacion/tests/e2e_digifact_ciclo.cjs
          deno test -A fel/demo-facturacion/tests/digifact_entorno_emisor_test.ts
      - name: Versión práctica · inicio de sesión (unidad), API real (Digifact simulado, plan y saldo, plataforma, aislamiento) y navegador en PC y teléfono (PWA); simulado y local
        run: |
          deno test -A fel/demo-facturacion/tests/sesiones_test.ts fel/demo-facturacion/tests/practico_api_test.ts
          node fel/demo-facturacion/tests/e2e_practico.cjs
      - name: Servidor de la demostración con el plano de control del agente (firma Ed25519 por HTTP, supervisor periódico y cierre ordenado; simulado y local)
        run: deno test -A fel/demo-facturacion/tests/agente_servidor_test.ts
      - name: Simulador FEL del agente local (núcleo, servidor 127.0.0.1 y formulario en Chromium; confirmación solo humana, interrupciones, duplicados; sin SAT ni credenciales)
        run: node --test "fel/agente-local/pruebas/nucleo.test.mjs" "fel/agente-local/pruebas/servidor.test.mjs" "fel/agente-local/pruebas/concesion.test.mjs" "fel/agente-local/pruebas/navegador.test.mjs" "fel/agente-local/pruebas/ejecutor_carrera.test.mjs"
      - name: Protección de la clave del agente (contrato de DPAPI; DPAPI real solo en el trabajo de Windows)
        run: node --test fel/agente-local/pruebas/proteccion.test.mjs
      - name: Transporte remoto seguro (8a) · NEXA falso hostil — TLS estricto, respuestas firmadas/alteradas/repetidas/vencidas, rotación y revocación de claves, interrupciones, espera exponencial y versión mínima
        run: node --test --test-timeout=60000 fel/agente-local/pruebas/transporte.test.mjs
      - name: Agente local con Playwright (Chromium 131 exigido) contra NEXA de prueba y el simulador; autorización humana separada, desconexiones, revocación, aislamiento, fencing y recuperación (todo local y simulado)
        timeout-minutes: 15
        run: node --test --test-concurrency=1 fel/agente-local/pruebas/agente.test.mjs
      - name: Panel y arranque del agente (vinculación desde la página, pausa, cierre ordenado y recuperación tras matar el proceso)
        timeout-minutes: 10
        run: node --test --test-concurrency=1 fel/agente-local/pruebas/panel.test.mjs
      - name: Transporte remoto (8a) de extremo a extremo contra NEXA real de prueba por HTTPS (intermediario hostil, rotación, versión mínima, sondeo, métricas, revocación)
        timeout-minutes: 12
        run: node --test --test-concurrency=1 --test-timeout=240000 fel/agente-local/pruebas/remoto.test.mjs
      - name: Guardia del script de integración (rechaza proyectos no autorizados)
        run: node --test fel/tools/integracion-local/guardia.test.mjs
      - name: PoC de viabilidad del portal FEL (guardia + autoprueba con Chrome contra página de ejemplo local; no toca ningún sistema real)
        run: |
          node --test fel/poc-sat/tests/guardia.test.mjs
          node fel/poc-sat/tests/autoprueba.mjs
          node fel/poc-sat/tests/simulacion-angular.mjs

  base-de-datos:
    name: Migraciones y RLS (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/supabase-cli
      - name: D2 · lo existente no cambió y las migraciones de D2 son solo aditivas
        run: python3 fel/supabase/tests/verificar_aditiva_d2.py
      - name: Levantar Supabase local y aplicar migraciones
        # Causa más probable del fallo intermitente «failed to bind host port 0.0.0.0:5432x: address already in use»: el rango de puertos EFÍMEROS del ejecutor (32768-60999) incluye los
        # puertos de Supabase (54321-54327); una conexión saliente cualquiera (p. ej. la descarga de imágenes) puede ocupar uno justo antes de que arranque el contenedor. Se acota el rango
        # efímero por debajo de 54000 (solo en esta máquina virtual desechable) y, si aun así falla, se detiene SOLO este proyecto (nombre «nexa-fel») y se reintenta una vez.
        run: |
          sudo sysctl -w net.ipv4.ip_local_port_range="32768 49999" >/dev/null || echo "no se pudo acotar el rango efímero (se continúa)"
          supabase --workdir fel start || { echo "Primer intento falló; se detiene este proyecto y se reintenta una vez"; supabase --workdir fel stop --no-backup || true; supabase --workdir fel start; }
      - name: Ejecutar pruebas SQL
        env:
          PGPASSWORD: postgres
        run: |
          for f in fel/supabase/tests/*.sql; do
            echo "== $f"
            psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -X -f "$f"
          done
      - name: Verificación posterior de la 29 y de la 30 sobre la pila local REAL de Supabase (con la función de la plataforma y las 30 migraciones aplicadas por la CLI; solo lectura)
        env:
          PGPASSWORD: postgres
        run: |
          P="psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -X"
          test "$($P -tA -c "select count(*) from supabase_migrations.schema_migrations")" = 30
          printf '%s\n' '\set ON_ERROR_STOP on' 'begin transaction read only;' '\i fel/docs/migracion-29/verificacion-posterior-29.sql' | $P
          printf '%s\n' '\set ON_ERROR_STOP on' 'begin transaction read only;' '\i fel/docs/migracion-tipos-documento/verificacion-tipos.sql' > "$RUNNER_TEMP/ver30.sql"
          SAL="$($P -tA -F'|' -f "$RUNNER_TEMP/ver30.sql")"; echo "$SAL"
          if grep -Eq '\|f$' <<< "$SAL" || ! grep -Eq '\|t$' <<< "$SAL"; then echo "La verificación de la 30 tiene filas con ok = false o no devolvió filas"; exit 1; fi
          echo "OK: 30 migraciones registradas; catálogo de la 29 y verificación de la 30 sanos en la plataforma real"
      - name: Pruebas de concurrencia (dos sesiones reales)
        env:
          PGPASSWORD: postgres
          PSQL_CMD: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
        run: bash fel/supabase/tests/concurrencia.sh
      - name: Procedimiento excepcional de eliminación de empresas (solo una empresa vacía; todo o nada)
        env:
          PGPASSWORD: postgres
          PSQL_CMD: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
        run: bash fel/supabase/tests/procedimiento_excepcional_empresas.sh
      - name: Verificación inicial en solo lectura (transacción de solo lectura que rechaza DML, DDL y permisos; PostgreSQL real)
        env:
          PGPASSWORD: postgres
          PSQL_CMD: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
        run: bash fel/supabase/tests/verificacion_inicial_solo_lectura.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Orquestador, agente local y plano de control contra PostgreSQL real (flujo, órdenes, firma, nonce, aislamiento, supervisor y prueba de propiedades con caídas)
        working-directory: fel/proveedores
        env:
          FEL_PGHOST: 127.0.0.1
          FEL_PGPORT: "54322"
          FEL_PGUSER: postgres
          FEL_PGPASSWORD: postgres
          FEL_PGDATABASE: postgres
        run: deno test -A pruebas_db/
      - name: Detener
        if: always()
        run: supabase --workdir fel stop --no-backup

  integracion-local:
    name: Integración con Supabase local real (Auth + PostgREST + fel-api)
    runs-on: ubuntu-latest
    # Supabase LOCAL y efímero: GoTrue, PostgREST y PostgreSQL reales con las migraciones; fel-api corre con Deno contra esa pila.
    # No usa ningún proyecto real ni credenciales reales.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: ./.github/actions/supabase-cli
      - name: Levantar Supabase local y aplicar migraciones
        # Causa más probable del fallo intermitente «failed to bind host port 0.0.0.0:5432x: address already in use»: el rango de puertos EFÍMEROS del ejecutor (32768-60999) incluye los
        # puertos de Supabase (54321-54327); una conexión saliente cualquiera (p. ej. la descarga de imágenes) puede ocupar uno justo antes de que arranque el contenedor. Se acota el rango
        # efímero por debajo de 54000 (solo en esta máquina virtual desechable) y, si aun así falla, se detiene SOLO este proyecto (nombre «nexa-fel») y se reintenta una vez.
        run: |
          sudo sysctl -w net.ipv4.ip_local_port_range="32768 49999" >/dev/null || echo "no se pudo acotar el rango efímero (se continúa)"
          supabase --workdir fel start || { echo "Primer intento falló; se detiene este proyecto y se reintenta una vez"; supabase --workdir fel stop --no-backup || true; supabase --workdir fel start; }
      - name: Exportar claves LOCALES de la pila efímera
        run: |
          supabase --workdir fel status -o env 2>/dev/null | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/sb.env"
          echo "Variables disponibles: $(cut -d= -f1 "$RUNNER_TEMP/sb.env" | tr '\n' ' ')"
      - name: Arrancar fel-api (Deno) contra la pila local
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}" FEL_APP_URL="http://127.0.0.1:3000/fel/" \
            nohup deno run -A fel/supabase/functions/fel-api/index.ts > "$RUNNER_TEMP/fel-api.log" 2>&1 &
          for i in $(seq 1 40); do curl -s -o /dev/null http://127.0.0.1:8000 && break; sleep 1; done
          curl -s -o /dev/null -w "fel-api responde: %{http_code}\n" http://127.0.0.1:8000
      - name: Etapa 1 · verificar (solo lectura)
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          RESULTADOS="$RUNNER_TEMP/integracion-verificar.json" node fel/tools/integracion-local/ejecutar.mjs --etapa=verificar
      - name: Etapa 2 · ejecutar (crea datos y escribe el manifiesto)
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          RESULTADOS="$RUNNER_TEMP/integracion-ejecutar.json" node fel/tools/integracion-local/ejecutar.mjs --etapa=ejecutar --manifiesto="$RUNNER_TEMP/manifiesto.json"
      - name: Alta de usuarios de la demostración por la API de administración de Auth REAL (id fijado por nosotros, confirmado, sin contraseña, idempotente)
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          deno run -A fel/tools/integracion-local/auth_admin_id.ts
      - name: Etapa 3 · limpiar (solo lo registrado en el manifiesto)
        if: always()
        run: |
          set -a; source "$RUNNER_TEMP/sb.env"; set +a
          if [ -f "$RUNNER_TEMP/manifiesto.json" ]; then
            RESULTADOS="$RUNNER_TEMP/integracion-limpiar.json" node fel/tools/integracion-local/ejecutar.mjs --etapa=limpiar --manifiesto="$RUNNER_TEMP/manifiesto.json"
          else echo "No hay manifiesto: la ejecución no creó nada."; fi
      - name: Registro de fel-api
        if: always()
        run: |
          echo "---- fel-api.log (últimas líneas) ----"; tail -n 40 "$RUNNER_TEMP/fel-api.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracion-local-resultados
          path: |
            ${{ runner.temp }}/integracion-*.json
            ${{ runner.temp }}/manifiesto.json
          if-no-files-found: ignore
      - name: Detener
        if: always()
        run: supabase --workdir fel stop --no-backup

  agente-windows:
    name: Agente local en Windows (DPAPI, arranque, Chromium 131, cierre y recuperación)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Instalar dependencias del agente (Playwright 1.49.1 fijado por package-lock) y Chromium
        working-directory: fel/agente-local
        run: |
          npm ci
          npx playwright install chromium
      - name: Comprobar versiones (Node 22, Playwright 1.49.1, Chromium 131) y arranque del navegador
        working-directory: fel/agente-local
        run: |
          node -e "if (Number(process.versions.node.split('.')[0]) !== 22) { console.error('Se esperaba Node 22 y hay ' + process.versions.node); process.exit(1); }"
          node -e "const v = require('playwright/package.json').version; if (v !== '1.49.1') { console.error('Playwright ' + v); process.exit(1); } require('playwright').chromium.launch().then(async b => { const m = b.version(); console.log('Chromium', m); await b.close(); if (!/^131[.]/.test(m)) { console.error('Se esperaba Chromium 131 y se obtuvo ' + m); process.exit(1); } })"
      - name: Protección de la clave con DPAPI real (ida y vuelta, datos alterados, entropía distinta, sin PEM en disco)
        run: node --test fel/agente-local/pruebas/proteccion.test.mjs
      - name: Simulador FEL (núcleo, servidor, concesiones y formulario en Chromium)
        run: node --test "fel/agente-local/pruebas/nucleo.test.mjs" "fel/agente-local/pruebas/servidor.test.mjs" "fel/agente-local/pruebas/concesion.test.mjs" "fel/agente-local/pruebas/navegador.test.mjs" "fel/agente-local/pruebas/ejecutor_carrera.test.mjs"
      - name: Agente local contra NEXA de prueba y el simulador (autorización humana, desconexiones, revocación, fencing, aislamiento, recuperación)
        timeout-minutes: 20
        run: node --test --test-concurrency=1 fel/agente-local/pruebas/agente.test.mjs
      - name: Panel y arranque del agente (vinculación desde la página, pausa, cierre ordenado, matar el proceso y recuperar)
        timeout-minutes: 15
        run: node --test --test-concurrency=1 fel/agente-local/pruebas/panel.test.mjs
      - name: Transporte remoto (8a) · NEXA falso hostil (TLS estricto, respuestas firmadas, rotación, interrupciones, espera exponencial, versión mínima)
        run: node --test --test-timeout=60000 fel/agente-local/pruebas/transporte.test.mjs
      - name: Transporte remoto (8a) de extremo a extremo contra NEXA real de prueba por HTTPS
        timeout-minutes: 15
        run: node --test --test-concurrency=1 --test-timeout=240000 fel/agente-local/pruebas/remoto.test.mjs

  salvaguarda-plataforma:
    name: Salvaguarda de la plataforma «rls_auto_enable» (definición real) y verificación inicial
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FEL_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Reconocimiento de la función (12 escenarios) y compatibilidad de las 29 migraciones con ella
        run: bash fel/tools/test-plataforma-ensure-rls.sh
