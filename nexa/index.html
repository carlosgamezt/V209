 fromRows(rows){const d={users:[],plans:[],notifs:[]};this.snap.clear();this.ua=new Map();rows.forEach(r=>{this.ua.set(r.col+'|'+r.id,r.updated_at||'');this.snap.set(r.col+'|'+r.id,JSON.stringify(r.data));if(r.col==='meta')d[r.id]=r.data;else(d[r.col]=d[r.col]||[]).push(r.data)});d.plans.sort((a,b)=>String(a.id).localeCompare(String(b.id)));d.notifs.sort((a,b)=>b.ts-a.ts);return d},
 async loadAll(){const rows=[];for(let f=0;;f+=1000){const{data,error}=await this.sb.from('pa_docs').select('col,id,data,updated_at').order('col').order('id').range(f,f+999);if(error)throw error;rows.push(...data);if(data.length<1000)break}return this.fromRows(rows)},

 save(d){if(!d)return;const next=new Map(),ch=[];this.rows(d).forEach(r=>{const k=r.col+'|'+r.id,j=JSON.stringify(r.data);next.set(k,j);const old=this.snap.get(k);if(old!==j)ch.push({r,isNew:old===undefined})});
  const del=[];this.snap.forEach((_,k)=>{if(!next.has(k)){const i=k.indexOf('|');del.push({col:k.slice(0,i),id:k.slice(i+1)})}});
  this.snap=next;if(!ch.length&&!del.length)return;const hk=ch.map(x=>x.r.col+'|'+x.r.id).concat(del.map(x=>x.col+'|'+x.id));this.hold=this.hold||new Map();hk.forEach(k=>{const h=this.hold.get(k)||{n:0,until:0};h.n++;this.hold.set(k,h)});const rel=()=>hk.forEach(k=>{const h=this.hold.get(k);if(h){h.n--;if(h.n<=0)h.until=Date.now()+4000}});
  this.q=this.q.then(async()=>{try{
   const ins=ch.filter(x=>x.isNew).map(x=>({col:x.r.col,id:x.r.id,data:x.r.data}));
   for(let i=0;i<ins.length;i+=25){const{error}=await this.sb.from('pa_docs').insert(ins.slice(i,i+25));if(error)throw error}
   for(const x of ch.filter(x=>!x.isNew)){const{data,error}=await this.sb.from('pa_docs').update({data:x.r.data,updated_at:new Date().toISOString()}).eq('col',x.r.col).eq('id',x.r.id).select('id');if(error)throw error;if(!data||!data.length)throw new Error('No tienes permiso para guardar ese cambio')}
   for(const x of del){const{data,error}=await this.sb.from('pa_docs').delete().eq('col',x.col).eq('id',x.id).select('id');if(error)throw error;if(!data||!data.length)throw new Error('No tienes permiso para eliminar eso')}
  rel()}catch(e){rel();this.hold.clear();toast('No se pudo guardar: '+(e.message||e)+'. Se recargan los datos.');await this.resync()}})},
 async refresh(force){if(!me||!db||!this.sb||this.rbusy||document.hidden&&!force)return;const now=Date.now();if(!force&&now-(this.rlt||0)<4000)return;if(this.hold&&[...this.hold.values()].some(h=>h.n>0))return;this.rbusy=1;
  try{const cur=new Map();for(let f=0;;f+=1000){const{data,error}=await this.sb.from('pa_docs').select('col,id,updated_at').order('col').order('id').range(f,f+999);if(error)throw error;data.forEach(r=>cur.set(r.col+'|'+r.id,r.updated_at||''));if(data.length<1000)break}
   if(!this.ua)this.ua=new Map();const chg=[],del=[];cur.forEach((u,k)=>{if(this.ua.get(k)!==u)chg.push(k)});this.ua.forEach((_,k)=>{if(!cur.has(k))del.push(k)});
   if(!chg.length&&!del.length)return;
   if(chg.length>60){const d=await this.loadAll();db=d;if(me)me=db.users.find(u=>u.id===me.id)||me;refreshUI();return}
   const by={};chg.forEach(k=>{const i=k.indexOf('|');(by[k.slice(0,i)]=by[k.slice(0,i)]||[]).push(k.slice(i+1))});
   for(const col in by){const{data,error}=await this.sb.from('pa_docs').select('col,id,data,updated_at').eq('col',col).in('id',by[col]);if(error)throw error;for(const r of data){const k=r.col+'|'+r.id,hh=this.hold&&this.hold.get(k);this.ua.set(k,r.updated_at||'');if(hh&&(hh.n>0||Date.now()<hh.until))continue;const j=JSON.stringify(r.data);if(this.snap.get(k)===j)continue;this.snap.set(k,j);this.apply(r.col,String(r.id),r.data)}}
   for(const k of del){const i=k.indexOf('|'),col=k.slice(0,i),id=k.slice(i+1);this.ua.delete(k);if(this.snap.has(k)){this.snap.delete(k);this.apply(col,id,undefined)}}
  }catch(e){}finally{this.rbusy=0;this.rlt=Date.now()}},
 async resync(){try{const d=await this.loadAll();db=d;if(me)me=db.users.find(u=>u.id===me.id)||me;render()}catch(e){}},
 listen(){if(this.ch)return;this.ch=this.sb.channel('pa-docs').on('postgres_changes',{event:'*',schema:'public',table:'pa_docs'},p=>this.onChange(p)).subscribe()},
 async onChange(p){try{const t=p.eventType,row=t==='DELETE'?p.old:p.new;if(!row||!row.col||row.id==null)return;const key=row.col+'|'+row.id;
  if(t==='DELETE'){this.snap.delete(key);this.apply(row.col,String(row.id),undefined);return}
  const hh=this.hold&&this.hold.get(key);if(t!=='DELETE'&&hh&&(hh.n>0||Date.now()<hh.until))return;let data=row.data;if(data===undefined){const r=await this.sb.from('pa_docs').select('data').eq('col',row.col).eq('id',row.id).maybeSingle();data=r.data&&r.data.data}
  if(data===undefined)return;const j=JSON.stringify(data);if(this.snap.get(key)===j)return;this.snap.set(key,j);this.apply(row.col,String(row.id),data)}catch(e){}},
 apply(col,id,data){if(!db)return;if(col==='meta'){if(data===undefined)delete db[id];else db[id]=data}else{const a=db[col]=db[col]||[],i=a.findIndex(x=>String(x.id)===id);if(data===undefined){if(i>=0)a.splice(i,1)}else if(i>=0)a[i]=data;else if(col==='notifs')a.unshift(data);else a.push(data)}
  if(me)me=db.users.find(u=>u.id===me.id)||me;refreshUI()}};

async function secLogin(){const raw=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value,e=$('#le'),b=$('#lb');if(!raw||!pw){e.textContent='Escribe tu usuario y tu contraseña.';return}
 const email=raw.includes('@')?raw:raw.replace(/[^a-z0-9._-]/g,'')+'@planes.sistegua.com';b.disabled=true;e.textContent='';
 const pg=$('#lpg'),pi=$('#lpi'),pp=$('#lpp'),pm=$('#lpm');let lv=0;const lset=(v,m)=>{lv=Math.max(lv,v);if(pi){pi.style.width=lv+'%';pp.textContent=Math.round(lv)+'%';if(m)pm.textContent=m}};if(pg){pg.style.display='block';lset(8,'Verificando tus datos…')}const lt=setInterval(()=>{if(lv<92)lset(lv+(92-lv)*.06)},250);window.__lstop=()=>{clearInterval(lt);if(pg)pg.style.display='none'};
 const{error}=await Supa.sb.auth.signInWithPassword({email,password:pw});lset(45,'Cargando tu información…');if(error){window.__lstop();e.textContent=(error.status===401||/api key|apikey/i.test(error.message||''))?'La conexión con el servidor no es válida (clave de Supabase incorrecta). Avisa al administrador.':'Usuario o contraseña incorrectos.';b.disabled=false;return}
 try{await Supa.afterLogin()}catch(x){window.__lstop();LOGIN_ERR=x.message||String(x);await Supa.sb.auth.signOut({scope:'local'});return}
 lset(100,'¡Listo!');window.__lstop();await new Promise(r=>setTimeout(r,250));view='dash';cur=null;pnOpen=false;render()}
function chgView(){$('#app').innerHTML=`<main style="margin:auto"><div class="card lgc" style="max-width:421px;margin:70px auto">${logoHtml}<h3>Cambia tu contraseña</h3><p>Es tu primer ingreso (o te restablecieron la contraseña). Elige una nueva de al menos 8 caracteres.</p><label>Contraseña nueva</label><input id="n1" type="password" autocomplete="new-password"><label>Repítela</label><input id="n2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')chgSave()"><p id="le" style="color:var(--bad)"></p><button onclick="chgSave()">GUARDAR Y ENTRAR</button></div></main>`}
async function chgSave(){const a=$('#n1').value,b=$('#n2').value,e=$('#le');if(a.length<8){e.textContent='Mínimo 8 caracteres.';return}if(a!==b){e.textContent='Las dos contraseñas no coinciden.';return}
 let em=null;try{const s0=await Supa.session();em=s0&&s0.user&&s0.user.email}catch(x){}
 const j=await Fn.call({action:'change_password',password:a});if(!j.ok){try{nxLog('cambio de contraseña falló: '+(j.error||'sin detalle'))}catch(x){}e.textContent=j.error||'No se pudo cambiar';return}
 /* al cambiar la contraseña el servidor puede invalidar la sesión actual: se vuelve a entrar sola con la contraseña nueva para no sacar al usuario */
 let ses=null;try{const g=await Supa.sb.auth.getSession();ses=g&&g.data&&g.data.session}catch(x){}
 if(em){try{const{error:re}=await Supa.sb.auth.signInWithPassword({email:em,password:a});try{nxLog('cambio de contraseña: reingreso '+(re?'falló ('+re.message+')':'ok')+' · sesión previa '+(ses?'viva':'perdida'))}catch(x){}}catch(x){try{nxLog('cambio de contraseña: reingreso error '+(x&&x.message||x))}catch(y){}}}
 CHG=false;Supa.profile.must_change=false;view='dash';render();toast('Contraseña actualizada')}
